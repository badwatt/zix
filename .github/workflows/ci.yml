name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: the job only reads the repository to build and test.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-zig reads .minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - name: Formatting
        run: zig build fmt:check
      - name: Tests
        run: zig build test --summary all

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v28
      - uses: mlugg/setup-zig@v2
      - name: Coverage
        run: zig build coverage
